<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Advanced WebSocket Chat Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; height: 100vh; margin: 0; }
    .sidebar { width: 30%; border-right: 1px solid #ccc; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; }
    .chat-window { width: 70%; display: flex; flex-direction: column; }
    #chat-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
    #chat-list li { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
    #chat-list li:hover { background-color: #f5f5f5; }
    #chat-list .room-info { font-weight: bold; }
    #chat-list .last-message { font-size: 0.9em; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #messages { flex-grow: 1; padding: 20px; overflow-y: scroll; border-bottom: 1px solid #ccc; }
    .message { margin-bottom: 8px; }
    .message-input { display: flex; padding: 10px; }
    #message { flex-grow: 1; padding: 8px; }
    .new-chat { padding-top: 15px; border-top: 1px solid #ccc; }
  </style>
</head>
<body>

<div class="sidebar">
  <h3>Chat Rooms</h3>
  <ul id="chat-list"></ul>
  <div class="new-chat">
    <input type="text" id="newOpponentId" placeholder="Enter Opponent UUID to start chat" size="30">
    <button onclick="startNewChat()">New Chat</button>
  </div>
</div>

<div class="chat-window">
  <div id="messages">
    <div class="message">채팅방을 선택해주세요.</div>
  </div>
  <div class="message-input">
    <input type="text" id="message" placeholder="Type a message..." disabled>
    <button onclick="sendMessage()" disabled>Send</button>
  </div>
</div>

<script>
  var stompClient = null;
  var currentSubscription = null;
  var currentRoomId = null;
  var currentOpponentId = null;
  const accessToken = localStorage.getItem("accessToken");

  window.onload = function() {
    if (!accessToken) {
      alert("No access token in localStorage. Please login first.");
      return;
    }
    connectAndFetchRooms();
  };

  function connectAndFetchRooms() {
    var socket = new SockJS('http://localhost:8080/ws-chat', null, { transports: ["websocket", "xhr-streaming", "xhr-polling"] });
    stompClient = Stomp.over(socket);
    stompClient.debug = () => {};

    stompClient.connect({ 'Authorization': 'Bearer ' + accessToken },
            frame => {
              console.log('Connected: ' + frame);
              fetchChatRooms();
            },
            error => console.error('Connection error: ' + error)
    );
  }

  async function fetchChatRooms() {
    try {
      const response = await fetch('http://localhost:8080/api/v1/chat/rooms', {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      if (!response.ok) throw new Error('Failed to fetch rooms');

      const apiResponse = await response.json();
      const rooms = apiResponse.data;
      const chatList = document.getElementById('chat-list');
      chatList.innerHTML = '';

      rooms.forEach(room => {
        const li = document.createElement('li');
        li.onclick = () => joinRoom(room.roomId, room.opponent.userId, room.opponent.userName);

        const roomInfo = document.createElement('div');
        roomInfo.className = 'room-info';
        roomInfo.textContent = room.opponent.userName;

        const lastMessage = document.createElement('div');
        lastMessage.className = 'last-message';
        lastMessage.textContent = room.lastMessage || '...';

        li.appendChild(roomInfo);
        li.appendChild(lastMessage);
        chatList.appendChild(li);
      });
    } catch (error) {
      console.error("Error fetching chat rooms:", error);
      alert("채팅방 목록을 불러오는 데 실패했습니다.");
    }
  }

  async function joinRoom(roomId, opponentId, opponentName) {
    console.log(`Joining room: ${roomId}, Opponent: ${opponentId}`);
    if (currentSubscription) {
      currentSubscription.unsubscribe();
    }

    currentRoomId = roomId;
    currentOpponentId = opponentId;

    const messagesDiv = document.getElementById('messages');
    messagesDiv.innerHTML = `<div class="message"><b>${opponentName}</b>님과의 대화 기록을 불러옵니다...</div>`;

    // 1. 과거 메시지를 불러오는 API 호출
    try {
      const response = await fetch(`http://localhost:8080/api/v1/chat/rooms/${roomId}/messages`, {
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      if (!response.ok) throw new Error('Failed to fetch past messages');

      const apiResponse = await response.json();
      const pastMessages = apiResponse.data;

      messagesDiv.innerHTML = ''; // 메시지창 초기화
      pastMessages.forEach(msg => showMessage(msg.senderName + ": " + msg.content));

    } catch (error) {
      console.error("Error fetching past messages:", error);
      messagesDiv.innerHTML = '<div class="message">과거 대화 기록을 불러오는 데 실패했습니다.</div>';
    }

    // 2. 과거 메시지 로딩 후, 실시간 메시지 수신을 위해 구독 시작
    //const destination = `/exchange/chat.exchange/chat.room.${roomId}`;
    const destination = `/topic/chat.${roomId}`;
    currentSubscription = stompClient.subscribe(destination, message => {
      const msgObj = JSON.parse(message.body);
      showMessage(msgObj.senderName + ": " + msgObj.content);
    });

    // 3. UI 활성화
    document.getElementById('message').disabled = false;
    document.querySelector('.message-input button').disabled = false;
    messagesDiv.scrollTop = messagesDiv.scrollHeight; // 스크롤 맨 아래로
  }

  function sendMessage() {
    const content = document.getElementById("message").value;
    if (!content.trim() || !currentOpponentId) return;

    const destination = `/pub/chat.message.${currentRoomId}`;

    stompClient.send(destination, {}, JSON.stringify({ 'content': content }));
    document.getElementById("message").value = "";
  }

  async function startNewChat() {
    const opponentId = document.getElementById('newOpponentId').value;
    if (!opponentId.trim()) {
      alert("상대방의 UUID를 입력해주세요.");
      return;
    }

    try {
      const response = await fetch(`http://localhost:8080/api/v1/chat/rooms?opponentId=${opponentId}`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + accessToken }
      });
      if (!response.ok) throw new Error('Failed to create new room');

      await response.json();
      fetchChatRooms(); // 채팅 목록 새로고침
    } catch (error) {
      console.error("Error creating new chat:", error);
      alert("새로운 채팅방을 만드는 데 실패했습니다.");
    }
  }

  function showMessage(message) {
    const messageElement = document.createElement('div');
    messageElement.className = "message";
    messageElement.textContent = message;

    const messagesDiv = document.getElementById('messages');
    messagesDiv.appendChild(messageElement);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  document.getElementById('message').addEventListener('keyup', event => {
    if (event.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
