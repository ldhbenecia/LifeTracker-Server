name: Deploy to GCP Compute Engine

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create application.yml in api module
        run: |
          mkdir -p api/src/main/resources
          echo "${{ secrets.APPLICATION_DEV }}" > api/src/main/resources/application.yml
          echo "✅ application.yml created successfully"
          ls -la api/src/main/resources/

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env file created successfully"
          echo "📄 .env file size: $(wc -c < .env) bytes"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:${{ github.run_number }}

      - name: Verify Docker image push
        run: |
          echo "✅ Docker image pushed successfully"
          echo "🐳 Image tag: ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:latest"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env,docker-compose.yml,nginx/"
          target: /home/sentthoughts/Sent-Server/

      - name: Verify files copied to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "📁 Checking files in /home/sentthoughts/Sent-Server/"
            ls -la /home/sentthoughts/Sent-Server/
            echo ""
            echo "📄 Checking .env file:"
            if [ -f "/home/sentthoughts/Sent-Server/.env" ]; then
              echo "✅ .env file exists ($(wc -c < /home/sentthoughts/Sent-Server/.env) bytes)"
            else
              echo "❌ .env file not found!"
            fi
            echo ""
            echo "📄 Checking docker-compose.yml:"
            if [ -f "/home/sentthoughts/Sent-Server/docker-compose.yml" ]; then
              echo "✅ docker-compose.yml exists"
            else
              echo "❌ docker-compose.yml not found!"
            fi
            echo ""
            echo "📁 Checking nginx directory:"
            if [ -d "/home/sentthoughts/Sent-Server/nginx" ]; then
              echo "✅ nginx directory exists"
              ls -la /home/sentthoughts/Sent-Server/nginx/
            else
              echo "❌ nginx directory not found!"
            fi

      - name: Setup SSL certificates
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/sentthoughts/Sent-Server
            echo "🔐 Setting up SSL certificates..."
            
            # Create certs directory if it doesn't exist
            if [ ! -d "certs" ]; then
              echo "📁 Creating certs directory..."
              ln -s /home/ubuntu/certs/devcerts ./certs
              echo "✅ SSL certificates linked successfully"
            else
              echo "✅ SSL certificates already configured"
            fi
            
            # Verify certificates
            if [ -f "certs/fullchain.pem" ] && [ -f "certs/privkey.pem" ]; then
              echo "✅ SSL certificates verified"
              ls -la certs/
            else
              echo "❌ SSL certificates not found!"
              exit 1
            fi

      - name: Check Docker status before deployment
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🐳 Current Docker containers:"
            docker ps -a
            echo ""
            echo "🌐 Current Docker networks:"
            docker network ls
            echo ""
            echo "💾 Docker system info:"
            docker system df

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/sentthoughts/Sent-Server
            echo "📍 Current directory: $(pwd)"
            
            echo "📥 Pulling latest Docker images..."
            docker-compose pull
            echo "✅ Docker images pulled successfully"
            
            echo "🛑 Stopping existing services..."
            docker-compose down
            echo "✅ Services stopped"
            
            echo "🚀 Starting services with docker-compose..."
            docker-compose up -d
            echo "✅ Services started successfully"
            
            echo "📋 Container status:"
            docker-compose ps
            
            echo "📝 Service logs (last 20 lines):"
            docker-compose logs --tail 20

      - name: Health check (wait for /health)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🏥 Starting health check..."
            
            # Wait for services to start
            echo "⏰ Waiting for services to initialize..."
            sleep 10
            
            for i in {1..12}
            do
              echo "⏰ Health check attempt $i/6 (waiting 4 seconds...)"
              sleep 4
            
              # Check if nginx is responding
              NGINX_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost || echo "000")
              echo "📊 Nginx status: $NGINX_STATUS"
            
              # Check if backend is responding through nginx
              BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health || echo "000")
              echo "📊 Backend health status: $BACKEND_STATUS"
            
              if [ "$BACKEND_STATUS" = "200" ]; then
                echo "✅ Health check passed!"
                echo "🎉 Application is running successfully!"
            
                # Final status check
                echo "📋 Final service status:"
                docker-compose ps
            
                # Test HTTPS if available
                HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k https://localhost || echo "000")
                echo "🔐 HTTPS status: $HTTPS_STATUS"
            
                exit 0
              else
                echo "⚠️ Waiting for services... (nginx: $NGINX_STATUS, backend: $BACKEND_STATUS)"
                echo "📝 Current service logs:"
                docker-compose logs --tail 5 sent_server nginx
                echo "🔍 Service status:"
                docker-compose ps
              fi
            done
            
            echo "❌ Health check failed after 12 attempts!"
            echo "🔍 Final service status:"
            docker-compose ps
            echo ""
            echo "📝 Full service logs:"
            docker-compose logs --tail 50
            echo ""
            echo "🌐 Network connectivity test:"
            curl -v http://localhost || echo "Connection failed"
            echo ""
            echo "📊 System resources:"
            df -h
            free -h
            exit 1