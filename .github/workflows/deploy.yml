name: Deploy to GCP Compute Engine

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create application.yml in api module
        run: |
          mkdir -p api/src/main/resources
          echo "${{ secrets.APPLICATION_DEV }}" > api/src/main/resources/application.yml
          echo "✅ application.yml created successfully"
          ls -la api/src/main/resources/

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env file created successfully"
          echo "📄 .env file size: $(wc -c < .env) bytes"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:${{ github.run_number }}

      - name: Verify Docker image push
        run: |
          echo "✅ Docker image pushed successfully"
          echo "🐳 Image tag: ${{ secrets.DOCKERHUB_USERNAME }}/sent-app:latest"

      - name: Prepare server directory
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/sentthoughts/Sent-Server
            echo "📁 Server directory prepared"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".env,docker-compose.yml,nginx"
          target: /home/sentthoughts/Sent-Server/

      - name: Verify files copied to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "📁 Checking files in /home/sentthoughts/Sent-Server/"
            ls -la /home/sentthoughts/Sent-Server/
            echo ""
            echo "📄 Checking .env file:"
            if [ -f "/home/sentthoughts/Sent-Server/.env" ]; then
              echo "✅ .env file exists ($(wc -c < /home/sentthoughts/Sent-Server/.env) bytes)"
            else
              echo "❌ .env file not found!"
            fi
            echo ""
            echo "📄 Checking docker-compose.yml:"
            if [ -f "/home/sentthoughts/Sent-Server/docker-compose.yml" ]; then
              echo "✅ docker-compose.yml exists"
            else
              echo "❌ docker-compose.yml not found!"
            fi
            echo ""
            echo "📁 Checking nginx directory:"
            if [ -d "/home/sentthoughts/Sent-Server/nginx" ]; then
              echo "✅ nginx directory exists"
              ls -la /home/sentthoughts/Sent-Server/nginx/
            else
              echo "❌ nginx directory not found!"
            fi

      - name: Setup SSL certificates
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/sentthoughts/Sent-Server
            echo "🔐 Setting up SSL certificates..."
            
            # Create certs directory if it doesn't exist
            if [ ! -d "certs" ]; then
              echo "📁 Creating certs directory..."
              ln -s /home/ubuntu/certs/devcerts ./certs
              echo "✅ SSL certificates linked successfully"
            else
              echo "✅ SSL certificates already configured"
            fi
            
            # Verify certificates
            if [ -f "certs/fullchain.pem" ] && [ -f "certs/privkey.pem" ]; then
              echo "✅ SSL certificates verified"
              ls -la certs/
            else
              echo "❌ SSL certificates not found!"
              exit 1
            fi

      - name: Check Docker status before deployment
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🐳 Current Docker containers:"
            docker ps -a
            echo ""
            echo "🌐 Current Docker networks:"
            docker network ls
            echo ""
            echo "💾 Docker system info:"
            docker system df

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/sentthoughts/Sent-Server
            echo "📍 Current directory: $(pwd)"
            
            echo "📥 Pulling latest Docker images..."
            docker-compose pull
            echo "✅ Docker images pulled successfully"
            
            echo "🛑 Stopping existing services..."
            docker-compose down
            echo "✅ Services stopped"
            
            echo "🚀 Starting services with docker-compose..."
            docker-compose up -d
            echo "✅ Services started successfully"
            
            echo "📋 Container status:"
            docker-compose ps
            
            echo "📝 Service logs (last 20 lines):"
            docker-compose logs --tail 20

      - name: Health check
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/sentthoughts/Sent-Server
            echo "🏥 Starting health check..."
            
            # Wait for services to start
            echo "⏰ Waiting for services to initialize..."
            sleep 10
            
            for i in {1..12}
            do
              echo "⏰ Health check attempt $i/12 (waiting 5 seconds...)"
              sleep 5
            
              # Check if nginx is responding (HTTP - should redirect to HTTPS)
              NGINX_HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost || echo "000")
              echo "📊 Nginx HTTP status (should be 301 redirect): $NGINX_HTTP_STATUS"
              
              # Check if HTTPS is working
              NGINX_HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k https://localhost || echo "000")
              echo "📊 Nginx HTTPS status: $NGINX_HTTPS_STATUS"
              
              # Check if backend is responding through nginx HTTPS
              BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k https://localhost/health || echo "000")
              echo "📊 Backend health status (HTTPS): $BACKEND_STATUS"
            
              # Success conditions: Either HTTPS localhost or domain should return 200
              if [ "$BACKEND_STATUS" = "200" ] || [ "$DOMAIN_STATUS" = "200" ]; then
                echo "✅ Health check passed!"
                echo "🎉 Application is running successfully!"
            
                # Final status check
                echo "📋 Final service status:"
                docker-compose ps
            
                # Additional verification
                echo "🔍 Final verification:"
                echo "  - HTTP to HTTPS redirect: $NGINX_HTTP_STATUS"
                echo "  - HTTPS localhost: $NGINX_HTTPS_STATUS"
                echo "  - Backend via HTTPS: $BACKEND_STATUS"
                echo "  - Domain access: $DOMAIN_STATUS"
            
                # Test actual response content
                HEALTH_RESPONSE=$(curl -s -k https://localhost/health || echo "No response")
                echo "  - Health response: $HEALTH_RESPONSE"
                
                exit 0
              else
                echo "⚠️ Waiting for services..."
                echo "  - HTTP redirect: $NGINX_HTTP_STATUS (expected: 301)"
                echo "  - HTTPS: $NGINX_HTTPS_STATUS"
                echo "  - Backend: $BACKEND_STATUS"
                echo "  - Domain: $DOMAIN_STATUS"
            
                echo "📝 Current service logs:"
                if [ -f "docker-compose.yml" ]; then
                  echo "🐳 Nginx logs:"
                  docker-compose logs --tail 3 nginx_proxy 2>/dev/null || echo "⚠️ Unable to get nginx logs"
                  echo "🚀 Backend logs:"
                  docker-compose logs --tail 3 sent_server 2>/dev/null || echo "⚠️ Unable to get backend logs"
                else
                  echo "❌ docker-compose.yml not found in $(pwd)"
                  ls -la
                fi
                
                echo "🔍 Service status:"
                if [ -f "docker-compose.yml" ]; then
                  docker-compose ps 2>/dev/null || echo "⚠️ Unable to get docker-compose status"
                else
                  echo "❌ docker-compose.yml not found"
                  docker ps -a | grep -E "(sent_server|nginx_proxy|mysql_sent|rabbitmq_sent)" || echo "No related containers found"
                fi
              fi
            done
            
            cho "❌ Health check failed after 12 attempts!"
      
            # Enhanced debug information
            echo "🔍 Current directory and files:"
            pwd
            ls -la
            
            echo "🔍 SSL certificates check:"
            if [ -d "certs" ]; then
              echo "✅ Certs directory exists"
              ls -la certs/
            else
              echo "❌ Certs directory not found"
            fi
            
            echo "🔍 Docker-compose file check:"
            if [ -f "docker-compose.yml" ]; then
              echo "✅ docker-compose.yml exists"
              docker-compose ps 2>/dev/null || echo "❌ docker-compose ps failed"
              echo "📝 Detailed logs:"
              docker-compose logs --tail 20 nginx_proxy 2>/dev/null || echo "❌ nginx logs failed"
              docker-compose logs --tail 20 sent_server 2>/dev/null || echo "❌ backend logs failed"
            else
              echo "❌ docker-compose.yml NOT FOUND!"
              echo "Available files:"
              ls -la
            fi
            
            echo "🔍 Manual container check:"
            docker ps -a | grep -E "(sent_server|nginx_proxy|mysql_sent|rabbitmq_sent)" || echo "No related containers found"
            
            echo "🌐 Network connectivity tests:"
            echo "HTTP test:"
            curl -v http://localhost 2>&1 | head -10 || echo "HTTP connection failed"
            echo ""
            echo "HTTPS test:"
            curl -v -k https://localhost 2>&1 | head -10 || echo "HTTPS connection failed"
            
            echo "📊 System resources:"
            df -h
            free -h
            
            echo "🔍 Port usage:"
            netstat -tlnp | grep -E ":80|:443|:8080" || echo "No ports found"
            
            exit 1